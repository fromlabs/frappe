name: flutter_petrol_pump_brew
description: Petrol Pump FRP example — Flutter UI with Brew.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_brew:
  flutter_frappe:
  frappe:
  petrol_pump_brew:
  audioplayers: ^6.4.0

resolution: workspace

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png
    - assets/nozzle1.png
    - assets/nozzle2.png
    - assets/nozzle3.png
    - assets/beep.wav
    - assets/fast.wav
    - assets/slow.wav
